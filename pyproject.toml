# Tool settings only (this project isn't packaged).

[tool.ruff.lint]
# Pyflakes plus syntax errors: undefined names, unused imports and
# variables, and the like. Pinned here because newer ruff releases enable a
# much wider set by default, including rules this code breaks on purpose
# (e.g. the status and history writers catch every exception by design).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
